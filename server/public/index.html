<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>katrina hub - دليل خدمات أبناء الكنيسة</title>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* =====================================================
       التصميم الأصلي الكامل - katrina hub
    ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Cairo", sans-serif;
      background:
        linear-gradient(rgba(255,255,255,.25), rgba(255,255,255,.70)),
        url("kat.png") center center / cover no-repeat fixed;
      min-height: 100vh;
      direction: rtl;
      color: #212529;
    }

    /* Container */
    .container {
      max-width: 1250px;
      margin: auto;
      padding: 0 20px;
    }

    /* Sticky Navbar */
    .navbar {
      background: linear-gradient(180deg, #1E3A8A, #243F9E);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(30, 58, 138, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 14px 0;
    }

    .navbar h1 {
      margin: 0;
      font-size: 1.4rem;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .navbar i.fa-church {
      font-size: 24px;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
    }

    .navbar-links {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .navbar-links button, .navbar-links a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }

    .navbar-links button:hover, .navbar-links a:hover {
      background: #ffffff;
      color: #1E3A8A;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
    }

    /* Section Headers */
    .section-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-header h2 {
      font-size: 40px;
      font-weight: 900;
      color: #1E3A8A;
      margin-bottom: 6px;
    }

    .section-header p {
      font-size: 18px;
      color: #2D3748;
      font-weight: 500;
    }

    /* Search Box */
    .search-box-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 40px;
    }

    .search-input {
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: #1E3A8A;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
    }

    .btn-search {
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      font-family: 'Cairo', sans-serif;
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(30, 58, 138, 0.35);
    }

    /* Stats Bar */
    .stats-bar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 20px 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      text-align: center;
      margin-bottom: 50px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .stat-item h4 {
      font-size: 28px;
      font-weight: 900;
      color: #1E3A8A;
      margin: 0;
    }
    .stat-item p {
      font-size: 13px;
      color: #64748b;
      margin: 2px 0 0;
      font-weight: 700;
    }

    /* Grid Desktop = 4 */
    .professions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    /* Profession Card */
    .profession-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.15);
      transition: .35s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .profession-card:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 20px 55px rgba(0,0,0,.25);
      background: rgba(255, 255, 255, 0.96);
    }

    .profession-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      color: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .profession-content {
      flex: 1;
      text-align: right;
    }

    .profession-content h3 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
      color: #111;
    }

    .profession-content p {
      font-size: 13px;
      color: #555;
    }

    .profession-arrow {
      color: #777;
      font-size: 16px;
      transition: color 0.3s;
    }

    .profession-card:hover .profession-arrow {
      color: #1E3A8A;
      transform: translateX(-4px);
    }

    /* Provider Cards */
    .provider-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.3s ease;
    }
    .provider-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }

    .btn-call {
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      flex: 1;
      border: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    .btn-call:hover {
      box-shadow: 0 6px 15px rgba(30, 58, 138, 0.4);
      transform: translateY(-2px);
      color: white;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
      flex: 1;
    }
    .btn-whatsapp:hover {
      box-shadow: 0 6px 15px rgba(37, 211, 102, 0.4);
      transform: translateY(-2px);
      color: white;
    }

    /* Footer */
    .footer {
      background: linear-gradient(180deg, #1E3A8A, #243F9E);
      padding: 35px 0;
      margin-top: 60px;
      box-shadow: 0 -8px 20px rgba(30, 58, 138, 0.4);
      border-top: 3px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      text-align: center;
    }

    .admin-pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #ffffff, #f0f5ff);
      color: #1E3A8A;
      padding: 12px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    .admin-pill-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      background: #ffffff;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      padding: 20px;
    }

    @media (max-width: 992px) {
      .professions-grid { grid-template-columns: repeat(3, 1fr); }
      .search-box-card { grid-template-columns: 1fr 1fr; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      .professions-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .profession-card { flex-direction: column; text-align: center; padding: 14px; }
      .profession-content { text-align: center; }
      .profession-icon { width: 48px; height: 48px; font-size: 18px; }
      .profession-content h3 { font-size: 13px; }
      .profession-content p { font-size: 11px; }
      .profession-arrow { display: none; }
      .search-box-card { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const formatWhatsapp = (phone) => {
      let clean = (phone || '').replace(/\D/g, '');
      if (clean.startsWith('0')) clean = '2' + clean;
      return `https://wa.me/${clean}`;
    };

    // Star Component
    const StarRating = ({ rating = 0, interactive = false, onRatingChange = () => {}, size = '16px' }) => {
      const [hover, setHover] = useState(0);
      return (
        <div style={{ display: 'inline-flex', gap: '3px', direction: 'ltr' }}>
          {[1, 2, 3, 4, 5].map((s) => {
            const filled = (hover || Math.round(rating)) >= s;
            return (
              <span
                key={s}
                onClick={() => interactive && onRatingChange(s)}
                onMouseEnter={() => interactive && setHover(s)}
                onMouseLeave={() => interactive && setHover(0)}
                style={{
                  cursor: interactive ? 'pointer' : 'default',
                  color: filled ? '#f59e0b' : '#cbd5e1',
                  fontSize: size,
                  transition: 'transform 0.15s'
                }}
              >
                ★
              </span>
            );
          })}
        </div>
      );
    };

    function App() {
      const [view, setView] = useState('home'); // 'home', 'profession', 'provider', 'admin-login', 'admin-dashboard'
      const [selectedProfId, setSelectedProfId] = useState(null);
      const [selectedProvId, setSelectedProvId] = useState(null);

      // Data
      const [professions, setProfessions] = useState([]);
      const [providers, setProviders] = useState([]);
      const [stats, setStats] = useState(null);

      // Search & Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [filterProf, setFilterProf] = useState('');
      const [filterArea, setFilterArea] = useState('');
      const [sortBy, setSortBy] = useState('rating');

      // Modals
      const [reviewModalOpen, setReviewModalOpen] = useState(false);
      const [reportModalOpen, setReportModalOpen] = useState(false);
      const [activeProviderForModal, setActiveProviderForModal] = useState(null);

      // Auth
      const [token, setToken] = useState(localStorage.getItem('token') || null);
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('user') || 'null'));

      // Admin State
      const [adminTab, setAdminTab] = useState('overview');
      const [allAdminProviders, setAllAdminProviders] = useState([]);
      const [allAdminProfessions, setAllAdminProfessions] = useState([]);
      const [allReviews, setAllReviews] = useState([]);
      const [allReports, setAllReports] = useState([]);
      const [alertMsg, setAlertMsg] = useState('');

      // Admin Modals
      const [providerFormModal, setProviderFormModal] = useState({ open: false, isEdit: false, data: null });
      const [professionFormModal, setProfessionFormModal] = useState({ open: false, isEdit: false, data: null });

      const showAlert = (msg) => {
        setAlertMsg(msg);
        setTimeout(() => setAlertMsg(''), 4000);
      };

      const loadData = async () => {
        try {
          const [pRes, provRes, sRes, rRes] = await Promise.all([
            fetch('/api/professions').then(r => r.json()),
            fetch('/api/providers').then(r => r.json()),
            fetch('/api/stats').then(r => r.json()),
            fetch('/api/reviews?status=approved').then(r => r.json())
          ]);
          setProfessions(pRes.data || []);
          setProviders(provRes.data || []);
          setStats(sRes.data || null);
          setAllReviews(rRes.data || []);
        } catch (e) {
          console.error(e);
        }
      };

      const loadAdminData = async () => {
        try {
          const headers = { 'Authorization': `Bearer ${token || localStorage.getItem('token')}` };
          const [pRes, profRes, rRes, repRes, sRes] = await Promise.all([
            fetch('/api/providers?all=true').then(r => r.json()),
            fetch('/api/professions').then(r => r.json()),
            fetch('/api/reviews', { headers }).then(r => r.json()),
            fetch('/api/reports', { headers }).then(r => r.json()),
            fetch('/api/stats').then(r => r.json())
          ]);
          setAllAdminProviders(pRes.data || []);
          setAllAdminProfessions(profRes.data || []);
          setAllReviews(rRes.data || []);
          setAllReports(repRes.data || []);
          setStats(sRes.data || null);
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const handleLogin = async (username, password) => {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            setToken(data.token);
            setUser(data.user);
            setView('admin-dashboard');
            loadAdminData();
          } else {
            alert(data.message || 'اسم المستخدم أو كلمة المرور غير صحيحة');
          }
        } catch (e) {
          alert('فشل الاتصال بالخادم');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        setToken(null);
        setUser(null);
        setView('home');
      };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Sticky Navbar (Same exact design) */}
          <div className="navbar">
            <div className="container">
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div onClick={() => setView('home')} style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }}>
                  <i className="fas fa-church"></i>
                  <h1>katrina hub</h1>
                </div>

                <div className="navbar-links">
                  <button onClick={() => setView('home')}>
                    <i className="fas fa-home"></i>
                    الرئيسية
                  </button>
                  <button onClick={() => { setSelectedProfId('all'); setView('profession'); }}>
                    <i className="fas fa-briefcase"></i>
                    المهن
                  </button>
                  {token ? (
                    <div style={{ display: 'flex', gap: '8px' }}>
                      <button onClick={() => { setView('admin-dashboard'); loadAdminData(); }}>
                        <i className="fas fa-user-shield"></i>
                        لوحة التحكم
                      </button>
                      <button onClick={handleLogout} title="تسجيل الخروج">
                        <i className="fas fa-sign-out-alt"></i>
                      </button>
                    </div>
                  ) : (
                    <button onClick={() => setView('admin-login')}>
                      <i className="fas fa-user-shield"></i>
                      دخول الإدارة
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* Main Body */}
          <main style={{ flex: 1, padding: '20px 0' }}>
            {/* VIEW 1: HOME PAGE */}
            {view === 'home' && (
              <section className="professions-section">
                <div className="container">
                  <div className="section-header">
                    <h2>المهن والخدمات</h2>
                    <p>اختر المهنة المناسبة لاحتياجاتك</p>
                  </div>

                  {/* Search & Multi-Filter Card */}
                  <div className="search-box-card">
                    <input
                      type="text"
                      placeholder="ابحث باسم الفني أو التخصص..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="search-input"
                    />
                    <select
                      value={filterProf}
                      onChange={(e) => setFilterProf(e.target.value)}
                      className="search-input"
                      style={{ cursor: 'pointer' }}
                    >
                      <option value="">كل المهن والتخصصات</option>
                      {professions.map(p => <option key={p._id} value={p._id}>{p.name}</option>)}
                    </select>
                    <input
                      type="text"
                      placeholder="المنطقة (شبرا، المعادي...)"
                      value={filterArea}
                      onChange={(e) => setFilterArea(e.target.value)}
                      className="search-input"
                    />
                    <button
                      onClick={() => {
                        setSelectedProfId(filterProf || 'all');
                        setView('profession');
                      }}
                      className="btn-search"
                    >
                      <i className="fas fa-search"></i>
                      بحث
                    </button>
                  </div>

                  {/* Live Stats Bar */}
                  {stats && (
                    <div className="stats-bar">
                      <div className="stat-item">
                        <h4>{stats.totalProviders || 0}+</h4>
                        <p>مقدم خدمة معتمد</p>
                      </div>
                      <div className="stat-item">
                        <h4>{stats.totalProfessions || 0}</h4>
                        <p>مهنة وتخصص مسجل</p>
                      </div>
                      <div className="stat-item">
                        <h4>{stats.totalReviews || 0}</h4>
                        <p>تقييم معتمد</p>
                      </div>
                      <div className="stat-item">
                        <h4 style={{ color: '#f59e0b' }}>★ {stats.averageRating || '5.0'}</h4>
                        <p>متوسط رضا العملاء</p>
                      </div>
                    </div>
                  )}

                  {/* Professions Grid */}
                  <div className="professions-grid">
                    {professions.map((prof) => (
                      <div
                        key={prof._id}
                        className="profession-card"
                        onClick={() => {
                          setSelectedProfId(prof._id);
                          setView('profession');
                        }}
                      >
                        <div className="profession-icon">
                          <i className={prof.icon || 'fas fa-tools'}></i>
                        </div>
                        <div className="profession-content">
                          <h3>{prof.name}</h3>
                          <p>عرض جميع مقدمي الخدمة</p>
                        </div>
                        <div className="profession-arrow">
                          <i className="fas fa-arrow-left"></i>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Top Rated Section */}
                  {providers.length > 0 && (
                    <div style={{ marginTop: '70px' }}>
                      <div className="section-header" style={{ marginBottom: '30px' }}>
                        <h2 style={{ fontSize: '32px' }}>الأعلى تقييماً في المنصة</h2>
                        <p style={{ fontSize: '16px' }}>أصحاب المهن الحاصلين على أعلى تقييمات</p>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: '20px' }}>
                        {providers.slice(0, 4).map((p) => (
                          <div key={p._id} className="provider-card">
                            <div>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                                <span style={{ fontSize: '12px', fontWeight: '800', background: '#eff6ff', color: '#1E3A8A', padding: '3px 10px', borderRadius: '15px' }}>
                                  {p.profession?.name || 'خدمة'}
                                </span>
                                <span style={{ fontSize: '11px', color: '#047857', fontWeight: '700', background: '#ecfdf5', padding: '2px 8px', borderRadius: '12px' }}>متاح</span>
                              </div>
                              <h3 
                                onClick={() => { setSelectedProvId(p._id); setView('provider'); }}
                                style={{ margin: '0 0 6px', fontSize: '18px', fontWeight: '800', color: '#111', cursor: 'pointer' }}
                              >
                                {p.name}
                              </h3>
                              <p style={{ margin: '0 0 8px', color: '#64748b', fontSize: '13px' }}>

          {reportModalOpen && activeProviderForModal && (
            <div className="modal-overlay">
              <div className="glass-panel" style={{ maxWidth: '440px', width: '100%', padding: '25px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px', borderBottom: '1px solid #eee', paddingBottom: '10px' }}>
                  <h3 style={{ margin: 0, fontSize: '18px', fontWeight: '900', color: '#e11d48' }}>
                    إبلاغ عن: {activeProviderForModal.name}
                  </h3>
                  <button onClick={() => setReportModalOpen(false)} style={{ background: 'none', border: 'none', fontSize: '18px', cursor: 'pointer', color: '#666' }}>✕</button>
                </div>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const form = e.target;
                  try {
                    const res = await fetch('/api/reports', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        providerId: activeProviderForModal._id,
                        userName: form.userName.value,
                        message: form.message.value
                      })
                    });
                    const d = await res.json();
                    alert(d.message || 'تم إرسال البلاغ للإدارة');
                    setReportModalOpen(false);
                  } catch(err) {
                    alert('فشل إرسال البلاغ');
                  }
                }} style={{ display: 'flex', flexDirection: 'column', gap: '12px', textAlign: 'right', fontSize: '13px' }}>
                  <div>
                    <label style={{ display: 'block', fontWeight: '700', marginBottom: '4px' }}>اسمك:</label>
                    <input type="text" name="userName" required placeholder="اسمك الثلاثي" style={{ width: '100%', padding: '10px', borderRadius: '10px', border: '1px solid #ccc', fontFamily: 'Cairo' }} />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontWeight: '700', marginBottom: '4px' }}>تفاصيل الشكوى:</label>
                    <textarea name="message" rows="4" required placeholder="يرجى توضيح المشكلة بدقة..." style={{ width: '100%', padding: '10px', borderRadius: '10px', border: '1px solid #ccc', fontFamily: 'Cairo', resize: 'none' }}></textarea>
                  </div>
                  <button type="submit" style={{ padding: '12px', borderRadius: '10px', border: 'none', background: '#e11d48', color: 'white', fontWeight: '800', cursor: 'pointer', fontFamily: 'Cairo', marginTop: '6px' }}>
                    إرسال الشكوى
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Footer (Exact same original design) */}
          <footer className="footer">
            <div className="container">
              <div style={{ textAlign: 'center' }}>
                <p style={{ color: '#ffffff', marginBottom: '15px', fontSize: '18px', fontWeight: '700', letterSpacing: '0.5px' }}>
                  katrina hub &copy; {new Date().getFullYear()}
                </p>

                <div style={{ margin: '20px 0' }}>
                  <button onClick={() => setView('admin-login')} className="admin-pill-btn">
                    <i className="fas fa-user-shield" style={{ fontSize: '20px' }}></i>
                    دخول لوحة التحكم
                  </button>
                </div>

                <p style={{ color: 'rgba(255,255,255,0.85)', fontSize: '15px', marginTop: '20px', lineHeight: '1.7', fontWeight: '500' }}>
                  جميع الحقوق محفوظة © كنيسة السيدة العذراء وسانت كاترين – الناصرية – العامرية – الإسكندرية<br />
                  هذا الموقع تابع رسميًا لإدارة الكنيسة ويُستخدم لتنظيم الخدمات والأنشطة.
                </p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
